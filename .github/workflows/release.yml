# 打 v* tag 时构建 Windows 安装包与 macOS 应用(DMG), 生成 SHA256SUMS 并发布 GitHub Release。
# 桌面端的在线更新读取这里发布的 Release, 并用 SHA256SUMS 校验下载的安装包。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 v0.1.0), 仅构建不发布"
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build
        shell: pwsh
        run: ./build.ps1 ${{ github.event.inputs.version || github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/build/bin/czlmail-amd64-installer.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Build
        working-directory: desktop
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          PRODUCT_VERSION="${VERSION#v}"; PRODUCT_VERSION="${PRODUCT_VERSION%%-*}"
          sed -i '' -E "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${PRODUCT_VERSION}\"/" wails.json
          "$(go env GOPATH)/bin/wails" build -platform darwin/universal -ldflags "-X main.version=${VERSION}"

      # 没有 Apple 开发者证书: 整个包做 ad-hoc 签名(Apple Silicon 不运行无签名代码, lipo 合并与写入 Info.plist
      # 会让链接器给的签名失效), 再打 DMG(拖进「应用程序」)。zip 保留给 0.0.x 旧版的在线更新。
      - name: Package
        working-directory: desktop/build/bin
        run: |
          app=$(ls -d *.app | head -n1)
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" czlmail-darwin-universal.zip
          mkdir dmg && ditto "$app" "dmg/$app" && ln -s /Applications dmg/Applications
          hdiutil create -volname "CZL Mail" -srcfolder dmg -ov -format UDZO czlmail-darwin-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            desktop/build/bin/czlmail-darwin-universal.dmg
            desktop/build/bin/czlmail-darwin-universal.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本说明写在带注释的 tag 里(git tag -a vX.Y.Z -F notes.md), 这里取出作为 Release 正文。
      # 轻量 tag 没有注释时 %(contents) 为空, 只保留自动生成的提交列表。
      - name: Release notes from tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > release-notes.md
          else
            : > release-notes.md
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum czlmail-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
