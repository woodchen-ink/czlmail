# 打 v* tag 时构建 Windows 安装包、macOS 应用(DMG) 与 Android APK, 生成 SHA256SUMS 并发布 GitHub Release。
# 桌面端与 Android 的在线更新读取这里发布的 Release, 并用 SHA256SUMS 校验下载的安装包。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 v0.1.0), 仅构建不发布"
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.0

jobs:
  notes-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Test notes persistence and directory moves
        working-directory: desktop
        run: go test ./internal/notes
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Test notes interactions and Markdown rendering
        working-directory: desktop/frontend
        run: pnpm test:notes
      - name: Lint notes changes
        working-directory: desktop/frontend
        run: pnpm exec eslint components/notes lib/notes components/settings/notes-section.tsx
      # Generated Wails bindings are absent on a clean checkout. Platform builds generate
      # them before Next.js performs its type check; do not run bare tsc in this job.

  windows:
    needs: notes-regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Test MCP bridge
        working-directory: desktop
        run: go test ./internal/mcpbridge

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails CLI and NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          if ($LASTEXITCODE -ne 0) { throw 'Wails CLI installation failed' }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              # Fixed upstream installer and checksum from microsoft/winget-pkgs NSIS.NSIS 3.13.
              $installer = Join-Path $env:RUNNER_TEMP 'nsis-3.13-setup.exe'
              curl.exe --fail --location --retry 3 --output $installer 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13-setup.exe/download'
              if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
              if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3') { throw 'NSIS checksum mismatch' }
              $process = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
            }
            $paths = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")
            foreach ($path in $paths) {
              if (Test-Path (Join-Path $path 'makensis.exe')) {
                $env:PATH = "$path;$env:PATH"
                $path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { throw 'NSIS compiler unavailable' }

      - name: Build
        shell: pwsh
        run: ./build.ps1 ${{ github.event.inputs.version || github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: desktop/build/bin/czlmail-amd64-installer.exe
          if-no-files-found: error

      # Android 用同一份界面: 静态导出依赖 Wails 生成的绑定 (wailsjs), 这里已经生成好, 直接交给 android 任务。
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: desktop/frontend/out
          if-no-files-found: error

  macos:
    needs: notes-regression
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Test MCP bridge
        working-directory: desktop
        run: go test ./internal/mcpbridge

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Build
        working-directory: desktop
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          PRODUCT_VERSION="${VERSION#v}"; PRODUCT_VERSION="${PRODUCT_VERSION%%-*}"
          sed -i '' -E "s/\"productVersion\": *\"[^\"]*\"/\"productVersion\": \"${PRODUCT_VERSION}\"/" wails.json
          "$(go env GOPATH)/bin/wails" build -platform darwin/universal -ldflags "-X main.version=${VERSION}"

      # 有 Developer ID 证书与公证 Key (仓库 secrets CZL_MACOS_* / CZL_APPLE_*) 时: hardened runtime 由内向外签名 .app,
      # 打 DMG 并签名, 提交公证后把票据钉到 DMG 与 .app 上, 再用公证过的 .app 打在线更新用的 zip。
      # secrets 不全(fork 仓库等)时退回 ad-hoc 签名: Apple Silicon 不运行无签名代码, lipo 合并与写入 Info.plist
      # 会让链接器给的签名失效; 这样的包首次打开要右键放行。
      # DMG 给首次安装(拖进「应用程序」), zip 给在线更新(解压后原地替换 .app)。
      - name: Package
        working-directory: desktop/build/bin
        env:
          CERT_P12_BASE64: ${{ secrets.CZL_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CZL_MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.CZL_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.CZL_APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.CZL_APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CZL_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=$(ls -d *.app | head -n1)
          dmg=czlmail-darwin-universal.dmg
          zip=czlmail-darwin-universal.zip
          plutil -lint "$app/Contents/Info.plist"

          make_dmg() {
            rm -rf dmg && mkdir dmg && ditto "$app" "dmg/$app" && ln -s /Applications dmg/Applications
            hdiutil create -volname "CZL Mail" -srcfolder dmg -ov -format UDZO "$dmg"
          }

          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$API_KEY_P8_BASE64" ] \
             || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::缺少 macOS 签名/公证 secrets, 改用 ad-hoc 签名, 用户首次打开需右键放行"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --keepParent "$app" "$zip"
            make_dmg
            exit 0
          fi

          # 证书导入一次性钥匙串, 清理在下一步(always)里做。
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "::error::钥匙串里没有 Team $TEAM_ID 的 Developer ID Application 证书"; exit 1; }

          # 由内向外: 先签包内其他 Mach-O(目前没有, 以后加 helper / dylib 时自动覆盖), 最后签 .app 本身。
          entitlements="$GITHUB_WORKSPACE/desktop/build/darwin/entitlements.plist"
          main_exe="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          sign() { codesign --force --options runtime --timestamp --entitlements "$entitlements" --sign "$identity" "$@"; }
          find "$app/Contents" -type f ! -path "$main_exe" -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then sign "$f"; fi
          done
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'

          make_dmg
          codesign --force --timestamp --sign "$identity" "$dmg"

          # 公证 DMG(会连同里面的 .app 一起登记), 失败时打印公证日志。
          echo "$API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          notary=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          xcrun notarytool submit "$dmg" "${notary[@]}" --wait --timeout 30m --output-format json | tee notary.json
          status=$(plutil -extract status raw notary.json)
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw notary.json)" "${notary[@]}" || true
            echo "::error::公证未通过: $status"; exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" notary.json

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"
          # .app 的票据在公证 DMG 时已登记, 钉上后在线更新的 zip 离线也能过 Gatekeeper。
          xcrun stapler staple "$app"
          spctl -a -vvv -t exec "$app"
          ditto -c -k --keepParent "$app" "$zip"

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            desktop/build/bin/czlmail-darwin-universal.dmg
            desktop/build/bin/czlmail-darwin-universal.zip
          if-no-files-found: error

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: desktop/frontend/out

      - name: Build Go core
        working-directory: android
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" bash scripts/build-core.sh

      # 签名密钥只在 secrets 里 (base64 的 .jks)。发版必须签名: 未签名或换了密钥的 APK 无法覆盖安装已有版本。
      - name: Build signed APK
        working-directory: android
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.CZL_ANDROID_KEYSTORE_BASE64 }}
          CZL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CZL_ANDROID_KEYSTORE_PASSWORD }}
          CZL_ANDROID_KEY_ALIAS: ${{ secrets.CZL_ANDROID_KEY_ALIAS }}
          CZL_ANDROID_KEY_PASSWORD: ${{ secrets.CZL_ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::missing secret CZL_ANDROID_KEYSTORE_BASE64"; exit 1; }
          export CZL_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$CZL_ANDROID_KEYSTORE"
          npm ci
          npx cap sync android
          (cd native && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain)
          apk=native/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner" verify --print-certs "$apk"
          cp "$apk" czlmail-android.apk
          rm -f "$CZL_ANDROID_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/czlmail-android.apk
          if-no-files-found: error

  publish:
    needs: [windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本说明写在带注释的 tag 里(git tag -a vX.Y.Z -F notes.md), 这里取出作为 Release 正文,
      # 桌面端「发现新版本」里展示的也是它。
      # 误打了轻量 tag 时退回到上个版本以来的提交说明, 不让 Release 只剩一行 Full Changelog。
      - name: Release notes from tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > release-notes.md
          else
            echo "::warning::${TAG} 是轻量 tag, 没有版本说明, 改用提交记录。请用 git tag -a ${TAG} -F notes.md"
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
            range="$TAG -1"; [ -n "$prev" ] && range="${prev}..${TAG}"
            git log --no-merges --format='### %s%n%n%b' $range | grep -vE '^(Co-Authored-By|Claude-Session):' > release-notes.md
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum czlmail-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
