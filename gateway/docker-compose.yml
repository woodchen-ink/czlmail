# czlmail JMAP gateway. Put a TLS reverse proxy (Caddy, nginx) in front of port 8080.
#
#   GATEWAY_MASTER_KEY=$(openssl rand -base64 32) GATEWAY_BASE_URL=https://mail-gw.example.com docker compose up -d
#
# Back up GATEWAY_MASTER_KEY: without it every stored mailbox password and OAuth token is lost.
services:
  gateway:
    image: ghcr.io/woodchen-ink/czlmail-gateway:${GATEWAY_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY (openssl rand -base64 32)}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?set GATEWAY_BASE_URL to the public https address}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      TZ: ${TZ:-UTC}
    volumes:
      - gateway-data:/data

volumes:
  gateway-data:
