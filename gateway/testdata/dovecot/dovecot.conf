# Test-only Dovecot for the gateway's integration tests (docker-compose.test.yml).
# Plaintext auth without TLS and a catch-all password: never use this anywhere else.
dovecot_config_version = 2.4.2
dovecot_storage_version = 2.4.2

default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
log_path = /dev/stdout
state_dir = /run/dovecot
protocols = imap

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

# alice and bob have fixed passwords; any other name signs in with "test", so each
# test can make its own empty mailbox (imaptest.NewUser).
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
passdb static {
  password = test
}

mail_uid = vmail
mail_gid = vmail
mail_home = /srv/vmail/%{user | lower}
mail_driver = sdbox
mail_path = ~/mail
mailbox_list_index = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

!include_try /etc/dovecot/local.conf
